
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Online Quiz System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #202633;
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(25, 38, 60, 0.09);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            color: #5b6472;
            line-height: 1.5;
            text-align: center;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #2457c5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background: #1946a8;
        }

        .flash {
            padding: 10px;
            margin: 10px 0;
            border-radius: 7px;
            background: #f1f4f8;
        }

        .flash.error {
            background: #fff0f0;
            color: #a12626;
        }

        .flash.success {
            background: #edfff2;
            color: #176b32;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2457c5;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Reset Your Password</h2>

        <p class="description">
            Your email has been verified successfully.
            Enter and confirm your new password.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('reset_password') }}">

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label for="password">New Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm New Password</label>

            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm new password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Update Password
            </button>

        </form>

        <a href="{{ url_for('login') }}" class="back-link">
            Back to Login
        </a>

    </div>

</body>
</html>
